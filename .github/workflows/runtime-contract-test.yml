name: Runtime Contract Test

on:
  pull_request:
  push:
    branches:
      - main
      - init/runtime-scaffold

permissions:
  contents: read

jobs:
  contract-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Verify lifecycle definition
        run: python scripts/verify_contract_lifecycle.py

      - name: Prove lifecycle transitions in isolated fixture
        run: python scripts/test_contract_lifecycle.py

      - name: Verify pinned contract
        run: python scripts/verify_contract_lock.py

      - name: Test execution boundary
        run: python -m pytest -q

      - name: Verify adoption remains explicit
        run: |
          grep -q "automatic_adoption: false" verification/contract-lifecycle.yaml
          grep -q "explicit_adoption_approval" verification/contract-lifecycle.yaml
          echo "ADOPTION GATE: EXPLICIT APPROVAL REQUIRED"
