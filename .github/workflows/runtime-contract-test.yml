name: Runtime Contract Test

on:
  pull_request:
  push:
    branches:
      - main
      - init/runtime-scaffold

permissions:
  contents: read

jobs:
  contract-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Verify LOCKED state
        run: python scripts/verify_contract_lifecycle.py

      - name: Verify pinned contract
        run: python scripts/verify_contract_lock.py

      - name: Test execution boundary
        run: python -m pytest -q

      - name: Record VERIFIED gate
        run: |
          test -f contracts.lock
          test -f verification/contract-lifecycle.yaml
          echo "VERIFIED gate: PASS"

      - name: Record CONFIRMED gate
        run: |
          echo "CONFIRMED gate: evidence criteria passed in this CI run"

      - name: Record ADOPTED gate
        run: |
          echo "ADOPTED gate: blocked by design — explicit adoption approval required"
